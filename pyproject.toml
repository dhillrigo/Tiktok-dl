[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-dl"
version = "0.1.0"
description = "Download all of your saved (favorited) TikTok videos from a TikTok data export or a list of URLs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Lets yt-dlp impersonate a browser, which TikTok increasingly requires.
impersonate = ["curl_cffi>=0.5"]

[project.scripts]
tiktok-dl = "tiktok_dl.cli:main"

[tool.setuptools.packages.find]
include = ["tiktok_dl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
